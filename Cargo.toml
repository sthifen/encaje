[package]
name = "linux-spacedesk-clone"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
openh264 = "0.9.8"
pipewire = "0.10.1"
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.21.1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4

# Las dependencias (OpenH264, ring…) se optimizan incluso en debug.
[profile.dev.package."*"]
opt-level = 3
