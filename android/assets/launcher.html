<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encaje</title>
<!-- Lo abre también el WebView de Android 4.4 (Chromium 30): sólo ES5, nada de
     grid, variables CSS ni fetch. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0d1117; color: #e6edf3; padding: 16px;
    font: 15px/1.45 Roboto, sans-serif; display: flex; align-items: center; justify-content: center; }
  main { width: 100%; max-width: 560px; }
  h1 { margin: 0 0 14px; font-size: 20px; font-weight: 600; }
  h1 small { display: block; color: #8b949e; font-weight: 400; font-size: 13px; }
  section { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h2 { margin: 0 0 10px; font-size: 15px; }
  p { margin: 0 0 10px; color: #8b949e; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #8b949e; margin-right: 6px; }
  .dot.ok { background: #3fb950; }
  input, button { font: inherit; border-radius: 10px; border: 1px solid #30363d; padding: 10px 12px; }
  input[type=text] { background: #0d1117; color: #e6edf3; width: 100%; min-width: 0; }
  button { background: #4f8cff; color: #fff; border: 0; font-weight: 600; }
  button:disabled { opacity: .45; }
  button.quiet { background: none; color: #4f8cff; padding: 4px 0; font-weight: 400; }
  .row { display: flex; }
  .row input { flex: 1; margin-right: 8px; }
  .pc { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  .pc small { display: block; font-weight: 400; opacity: .8; }
  #native-row { display: flex; align-items: center; color: #9a9a9a; font-size: 13px; }
  #native-row input { margin: 0 8px 0 0; }
  #msg { color: #f0883e; font-size: 13px; min-height: 1em; margin-bottom: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Encaje<small>Abre Encaje en el PC y toca su nombre aquí.</small></h1>
  <div id="msg"></div>
  <section id="taken" hidden>
    <h2 id="taken-text"></h2>
    <button id="take">Usar en esta tablet</button>
  </section>
  <section>
    <h2>En tu WiFi</h2>
    <div id="pcs"></div>
    <p id="scan-state"><span class="dot"></span>Buscando tu PC…</p>
    <button id="more" class="quiet">¿No aparece? Escribir la dirección</button>
    <div id="manual" hidden>
      <p>Es la dirección que muestra Encaje en el PC.</p>
      <div class="row"><input id="host" type="text" placeholder="192.168.1.50" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="wifi-btn">Conectar</button></div>
    </div>
  </section>
  <section id="usb">
    <h2>Por cable USB</h2>
    <p id="usb-state"><span class="dot"></span>Buscando PC…</p>
    <button id="usb-btn" disabled>Conectar por USB</button>
  </section>
  <label id="native-row" hidden><input type="checkbox" id="native"> Visor nativo (menos retraso; desmárcalo para usar el del navegador)</label>
</main>
<script>
"use strict";
var DEFAULT_PORT = 8787, SCAN_PAUSE_MS = 8000;
function $(id) { return document.getElementById(id); }
function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } }
function set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }

// Al volver del visor sólo cambia el "#": hay que arrancar de nuevo.
window.onhashchange = function () { location.reload(); };

// Al volver con "atrás" no se reconecta solo; tras un error sí. Si el monitor
// lo usa otra tablet tampoco: quitárselo lo decide la persona.
var taken = /^#(busy|replaced)\|([^|]*)\|([^|]*)\|(\d+)$/.exec(location.hash);
var auto = location.hash !== "#manual" && !taken;
if (location.hash === "#error") $("msg").textContent = "Se perdió la conexión con el PC. Reintentando…";
if (taken) {
  var by = decodeURIComponent(taken[2]);
  $("taken-text").textContent = (taken[1] === "busy" ? "En uso en " : "Ahora se usa en ") + by;
  $("taken").hidden = false;
  $("take").onclick = function () { go(taken[3], parseInt(taken[4], 10), true); };
}

function probe(host, port, done) {
  var x = new XMLHttpRequest(), ended = false;
  function end(info) { if (!ended) { ended = true; done(info); } }
  x.open("GET", "http://" + host + ":" + port + "/info?" + Date.now());
  x.timeout = 1500;
  x.onload = function () {
    var info = null;
    try { if (x.status === 200) info = JSON.parse(x.responseText); } catch (_) {}
    end(info);
  };
  x.onerror = x.ontimeout = function () { end(null); };
  x.send();
}

// Visor nativo de la app (MediaCodec directo a la pantalla) si está
// disponible y elegido; si no, el web ("localhost" es contexto seguro: podrá
// usar WebCodecs).
var bridge = window.EncajeNative;
if (bridge.webViewerWorks()) {
  $("native-row").hidden = false;
  $("native").checked = bridge.isEnabled();
  $("native").onchange = function () { bridge.setEnabled($("native").checked); };
}
function go(host, port, pick) {
  connecting = true; // mientras se usa el visor no se busca nada
  if (bridge.open(host, port, pick)) return;
  location.href = "http://" + host + ":" + port + "/" + (pick ? "?pick=1" : "");
}

// Acepta lo que se copie del PC: "http://192.168.1.50:8787/", "192.168.1.50:8787"
// o "192.168.1.50".
function parseAddress(text) {
  var m = /^(?:https?:\/\/)?([^\/:\s]+)(?::(\d+))?\/?$/i.exec(text.replace(/^\s+|\s+$/g, ""));
  return m ? { host: m[1], port: parseInt(m[2], 10) || DEFAULT_PORT } : null;
}

function showPcs(pcs) {
  var box = $("pcs");
  box.textContent = "";
  pcs.forEach(function (pc) {
    var b = document.createElement("button"), small = document.createElement("small");
    b.className = "pc";
    b.textContent = pc.name;
    small.textContent = pc.host;
    b.appendChild(small);
    b.onclick = function () { bridge.rememberPc(pc.id); go(pc.host, pc.port, true); };
    box.appendChild(b);
  });
}

// Un PC con cable y WiFi responde por dos direcciones: se muestra una sola.
function uniquePcs(pcs) {
  var seen = {};
  return pcs.filter(function (pc) {
    var isNew = !(pc.id in seen);
    seen[pc.id] = true;
    return isNew;
  });
}

// Si hay cable manda el cable: por WiFi sólo se conecta solo cuando ya se sabe
// que por USB no hay nada.
var connecting = false, nextScan = 0, usbMissing = !bridge.usbWorks();
function pollScan() {
  if (connecting) return;
  var s = JSON.parse(bridge.scanState()), last = bridge.lastPc();
  s.pcs = uniquePcs(s.pcs);
  showPcs(s.pcs);
  // El PC de siempre se conecta solo, aunque le haya cambiado la IP.
  for (var i = 0; auto && usbMissing && i < s.pcs.length; i++) {
    if (s.pcs[i].id === last) { go(s.pcs[i].host, s.pcs[i].port, false); return; }
  }
  $("scan-state").innerHTML = s.pcs.length
    ? '<span class="dot ok"></span>Toca tu PC para conectar.'
    : '<span class="dot"></span>Buscando tu PC…';
  if (!s.scanning && Date.now() >= nextScan) {
    nextScan = Date.now() + SCAN_PAUSE_MS;
    bridge.scan(DEFAULT_PORT);
  }
  setTimeout(pollScan, 700);
}

function pollUsb() {
  if (connecting) return;
  probe("localhost", DEFAULT_PORT, function (info) {
    if (connecting) return;
    usbMissing = !info;
    $("usb-state").innerHTML = info
      ? '<span class="dot ok"></span>PC detectado · ' + info.width + "×" + info.height + " @ " + info.fps + " fps"
      : '<span class="dot"></span>Buscando PC por USB…';
    $("usb-btn").disabled = !info;
    if (info && auto) { go("localhost", DEFAULT_PORT, false); return; }
    setTimeout(pollUsb, 1500);
  });
}

$("more").onclick = function () {
  $("more").hidden = true;
  $("manual").hidden = false;
  $("host").focus();
};
$("usb-btn").onclick = function () { go("localhost", DEFAULT_PORT, true); };
$("host").value = get("host", "");
$("wifi-btn").onclick = function () {
  var a = parseAddress($("host").value);
  if (!a) { $("msg").textContent = "Escribe la dirección del PC, por ejemplo 192.168.1.50."; return; }
  set("host", $("host").value);
  $("msg").textContent = "Conectando…";
  probe(a.host, a.port, function (info) {
    if (info) { if (info.id) bridge.rememberPc(info.id); go(a.host, a.port, true); }
    else $("msg").textContent = "No se pudo contactar con " + a.host + ":" + a.port + ". ¿Está Encaje abierto en el PC y el cortafuegos permite la conexión?";
  });
};

pollScan();
if (bridge.usbWorks()) pollUsb();
else $("usb").hidden = true;
</script>
</body>
</html>
